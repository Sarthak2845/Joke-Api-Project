<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Atma:300,regular,500,600,700" rel="stylesheet" />
    <link href='https://fonts.googleapis.com/css?family=Baloo Bhai' rel='stylesheet'>
    <link rel="shortcut icon" href="./favicon_io/android-chrome-192x192.png" type="image/x-icon">

    <title>Dank Jokes</title>

<body>
    <header>
        <h1>🤣 Laugh <span>Out</span> Loud! 🤣</h1>
    </header>
    <main>
        <p class="sub-title">Need a quick laugh? Click the button below to get a random joke!</p>
        <div class="joke-container">
            <p class="emoji">😂</p>
            <p class="joke">Why don't skeletons fight each other? They don't have the guts!</p>
            <span class="category">Misc</span>
            <button class="btn">Crack Me Up!</button>
            <p class="footer">Made with 😂 and 💻</p>
        </div>
    </main>
</body>
